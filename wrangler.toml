name = "aker-website"
pages_build_output_dir = "."
compatibility_date = "2026-06-01"

# İçerik veri tabanı. Yönetim panelinden yapılan değişiklikler buraya yazılır,
# genel sayfalar functions/_middleware.ts üzerinden buradan okur.
[[d1_databases]]
binding = "DB"
database_name = "aker-website"
database_id = "e4e73ca8-8ac6-4fa3-9511-3686e45ac3ef"

# Panelden yüklenen görseller. /img/uploads/<anahtar> adresinden servis edilir.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aker-website-media"

[vars]
# Gizli değerler buraya YAZILMAZ. Lokalde .dev.vars, canlıda Pages secret kullanılır:
#   ADMIN_PASSWORD  - yönetim paneli şifresi
#   SESSION_SECRET  - oturum çerezini imzalayan anahtar
#   RESEND_API_KEY / CONTACT_TO_EMAIL / MAIL_FROM - iletişim formu e-postası
SITE_ORIGIN = "https://akerosgb.com.tr"
